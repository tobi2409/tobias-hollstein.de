<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Desktop-Anwendung Icon">
  <defs>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFB"/>
      <stop offset="100%" stop-color="#DDE4EC"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect x="20" y="20" width="280" height="200" rx="10" fill="url(#winGrad)" stroke="#8AA0BE" stroke-width="3"/>

  <!-- Titlebar -->
  <rect x="20" y="20" width="280" height="34" rx="10" fill="#3A6BB5"/>
  <rect x="20" y="40" width="280" height="14" fill="#3A6BB5"/>

  <!-- Window buttons -->
  <circle cx="44" cy="37" r="6" fill="#FF5F57"/>
  <circle cx="62" cy="37" r="6" fill="#FEBC2E"/>
  <circle cx="80" cy="37" r="6" fill="#28C840"/>

  <!-- Menubar -->
  <rect x="20" y="54" width="280" height="24" fill="#EBF0F8"/>
  <text x="34" y="70" font-family="sans-serif" font-size="11" fill="#3A4A6B">Datei</text>
  <text x="72" y="70" font-family="sans-serif" font-size="11" fill="#3A4A6B">Bearbeiten</text>
  <text x="132" y="70" font-family="sans-serif" font-size="11" fill="#3A4A6B">Ansicht</text>
  <text x="185" y="70" font-family="sans-serif" font-size="11" fill="#3A4A6B">Hilfe</text>

  <!-- Grid lines vertical -->
  <line x1="108" y1="78" x2="108" y2="210" stroke="#B8C9DA" stroke-width="1.5"/>
  <line x1="196" y1="78" x2="196" y2="210" stroke="#B8C9DA" stroke-width="1.5"/>

  <!-- Grid lines horizontal -->
  <line x1="20" y1="108" x2="300" y2="108" stroke="#B8C9DA" stroke-width="1.5"/>
  <line x1="20" y1="140" x2="300" y2="140" stroke="#B8C9DA" stroke-width="1.5"/>
  <line x1="20" y1="172" x2="300" y2="172" stroke="#B8C9DA" stroke-width="1.5"/>

  <!-- Header row -->
  <rect x="20" y="78" width="280" height="30" fill="#D0DBEF"/>
  <text x="50" y="97" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2B3A5A">Name</text>
  <text x="130" y="97" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2B3A5A">Datum</text>
  <text x="214" y="97" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2B3A5A">Status</text>

  <!-- Cell content row 1 -->
  <text x="34" y="128" font-family="sans-serif" font-size="10" fill="#3A4A6B">Eintrag 1</text>
  <text x="122" y="128" font-family="sans-serif" font-size="10" fill="#3A4A6B">01.01.26</text>
  <rect x="206" y="115" width="54" height="16" rx="5" fill="#43C59E"/>
  <text x="216" y="127" font-family="sans-serif" font-size="9" fill="white">Aktiv</text>

  <!-- Cell content row 2 -->
  <text x="34" y="160" font-family="sans-serif" font-size="10" fill="#3A4A6B">Eintrag 2</text>
  <text x="122" y="160" font-family="sans-serif" font-size="10" fill="#3A4A6B">15.03.26</text>
  <rect x="206" y="147" width="54" height="16" rx="5" fill="#FFB62E"/>
  <text x="212" y="159" font-family="sans-serif" font-size="9" fill="white">Aussteh.</text>

  <!-- Cell content row 3 -->
  <text x="34" y="192" font-family="sans-serif" font-size="10" fill="#3A4A6B">Eintrag 3</text>
  <text x="122" y="192" font-family="sans-serif" font-size="10" fill="#3A4A6B">22.06.26</text>
  <rect x="206" y="179" width="54" height="16" rx="5" fill="#FF5F57"/>
  <text x="214" y="191" font-family="sans-serif" font-size="9" fill="white">Inaktiv</text>
</svg>
