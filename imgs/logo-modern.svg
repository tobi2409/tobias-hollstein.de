<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Logo mit Glühlampe, Organigramm und Buch</title>
  <desc id="desc">Modernes farbiges Logo in Dreiecksform mit Glühlampe oben, Organigramm links und aufgeschlagenem Buch rechts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#E8FFF6"/>
    </linearGradient>

    <linearGradient id="bulbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD95A"/>
      <stop offset="100%" stop-color="#FFB62E"/>
    </linearGradient>

    <linearGradient id="orgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#2C5DE5"/>
    </linearGradient>

    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43C59E"/>
      <stop offset="100%" stop-color="#1F9E7A"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00213A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect x="20" y="20" width="600" height="600" rx="140" fill="url(#bg)"/>
  <g filter="url(#softShadow)">
    <path d="M320 105 L125 435 L515 435 Z" fill="#FFFFFF"/>
  </g>

  <!-- Triangle connectors -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 210 L206 380" stroke="#9DB8FF" stroke-width="16"/>
    <path d="M320 210 L434 380" stroke="#8FDCC6" stroke-width="16"/>
    <path d="M206 380 L434 380" stroke="#B7C7E8" stroke-width="16"/>
  </g>

  <!-- Top: Bulb -->
  <g transform="translate(320 170)">
    <circle cx="0" cy="0" r="56" fill="url(#bulbGrad)" stroke="#E39A14" stroke-width="6"/>
    <rect x="-20" y="45" width="40" height="22" rx="8" fill="#6E6F85"/>
    <rect x="-17" y="64" width="34" height="18" rx="6" fill="#5C5D73"/>
    <path d="M-14 -4 C-7 -20 7 -20 14 -4 C18 5 12 14 4 18 L4 30 L-4 30 L-4 18 C-12 14 -18 5 -14 -4 Z" fill="#FFF4C1" opacity="0.85"/>
    <path d="M0 -70 L0 -90 M-49 -49 L-63 -63 M49 -49 L63 -63" stroke="#FFC53A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Left: Organigram -->
  <g transform="translate(206 380)">
    <rect x="-46" y="-38" width="92" height="48" rx="12" fill="url(#orgGrad)"/>
    <rect x="-90" y="52" width="58" height="38" rx="10" fill="#76A8FF"/>
    <rect x="32" y="52" width="58" height="38" rx="10" fill="#76A8FF"/>

    <path d="M0 10 L0 40 M-61 40 L61 40" stroke="#2C5DE5" stroke-width="8" stroke-linecap="round"/>
    <path d="M-61 40 L-61 52 M61 40 L61 52" stroke="#2C5DE5" stroke-width="8" stroke-linecap="round"/>

    <circle cx="0" cy="-14" r="8" fill="#DDEAFF"/>
    <circle cx="-61" cy="70" r="6" fill="#DDEAFF"/>
    <circle cx="61" cy="70" r="6" fill="#DDEAFF"/>
  </g>

  <!-- Right: Open book -->
  <g transform="translate(434 380)">
    <path d="M-88 -20 Q-46 -46 0 -26 L0 86 Q-47 66 -88 88 Z" fill="url(#bookGrad)"/>
    <path d="M88 -20 Q46 -46 0 -26 L0 86 Q47 66 88 88 Z" fill="#2DB58E"/>

    <path d="M-66 6 Q-36 -8 -8 2" stroke="#CFF5E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M-66 28 Q-36 14 -8 24" stroke="#CFF5E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 6 Q36 -8 8 2" stroke="#CFF5E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 28 Q36 14 8 24" stroke="#CFF5E8" stroke-width="5" stroke-linecap="round"/>

    <path d="M0 -26 L0 86" stroke="#157C60" stroke-width="6"/>
  </g>

  <!-- Outer ring for modern badge feel -->
  <rect x="36" y="36" width="568" height="568" rx="126" fill="none" stroke="#C8D7E9" stroke-width="8"/>
</svg>
