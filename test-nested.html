<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test verschachtelte Ausdrücke</title>
</head>
<body>
    <h1>Test für verschachtelte Ausdrücke</h1>
    
    <h2>Testprogramm:</h2>
    <pre id="program">
program start
write h[1,1] := 2
write h[1,2] := 3
write [h[1,1], h[1,2]] := 99
program-end
    </pre>
    
    <button onclick="runTest()">Test ausführen</button>
    
    <h2>Ergebnis:</h2>
    <div id="result"></div>
    
    <h2>Notizblock:</h2>
    <pre id="notizblock"></pre>
    
    <h2>Arbeitsblatt:</h2>
    <pre id="arbeitsblatt"></pre>
    
    <script src="js/micro-lang.js"></script>
    <script>
        function runTest() {
            const code = document.getElementById('program').textContent.trim()
            const resultDiv = document.getElementById('result')
            const notizblockDiv = document.getElementById('notizblock')
            const arbeitsblattDiv = document.getElementById('arbeitsblatt')
            
            try {
                const tokens = MicroLang.tokenize(code)
                console.log('Tokens:', tokens)
                
                const programs = MicroLang.parse(tokens)
                console.log('Programs:', programs)
                
                const memory = {}
                const helperMemory = {}
                const result = MicroLang.run(programs, 'start', memory, helperMemory)
                
                console.log('Final memory:', result.memory)
                console.log('Final helperMemory:', result.helperMemory)
                
                resultDiv.innerHTML = '<span style="color: green;">✓ Erfolgreich ausgeführt!</span>'
                notizblockDiv.textContent = JSON.stringify(result.memory, null, 2)
                arbeitsblattDiv.textContent = JSON.stringify(result.helperMemory, null, 2)
                
                // Prüfe ob [2,3] == 99
                if (result.memory[2] && result.memory[2][3] === 99) {
                    resultDiv.innerHTML += '<br><span style="color: green; font-weight: bold;">✓ Verschachtelte Adresse [h[1,1], h[1,2]] = [2,3] = 99 funktioniert!</span>'
                } else {
                    resultDiv.innerHTML += '<br><span style="color: red;">✗ Verschachtelte Adresse hat nicht funktioniert</span>'
                }
                
            } catch (e) {
                resultDiv.innerHTML = '<span style="color: red;">✗ Fehler: ' + e.message + '</span>'
                console.error(e)
            }
        }
    </script>
</body>
</html>
